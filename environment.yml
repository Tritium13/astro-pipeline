# Conda environment for the astro-pipeline project.
# Versions are intentionally NOT pinned here: after the first install,
# record the exact resolved versions in docs/worklog.md
# (conda env export --from-history / conda list).
name: astro-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - matplotlib
  - astropy          # FITS I/O, WCS, visualization (stretches/normalization)
  - astroquery       # MAST queries and downloads
  - reproject        # resample filters onto a common WCS grid ("registration")
  - scikit-image     # optional: extra image ops, star masking etc.
  - pillow           # PNG/JPEG export
  - tifffile         # 16-bit TIFF export
  - jupyterlab
  - ipykernel
