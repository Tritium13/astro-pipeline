# NGC 5643 from both observations of programme 1685 (o011 + o012), started from the explorer config.
# Generated by astropipe.explore – default values, refine by hand.
# Target: N5643  |  RA 218.16900  Dec -44.17377  |  classification: Galaxy; Spiral galaxies

[run]
name = "ngc5643"

[data]
program = 1685
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw01685_o012_t006_n5643_nircam"
obs = ["jw01685-o011_t006_", "jw01685-o012_t006_"]   # two epochs, 15 days apart, shifted/rotated -> gaps partly filled
bands = ["F090W", "F150W", "F277W"]
max_gb = 6.0

[clean]
method = "auto"

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = [3860, 1597]   # nucleus (red cross in output/runs/ngc5643_A_chromatic_overview.jpg); grid pixels [y, x]
size_px = 2100           # square ~2.2'; includes the thin remaining gap right of the nucleus (black)
center_band = "F277W"
margin = 100
aspect = 1.0

[caption]
title = "NGC 5643 – JWST NIRCam"
description = "Barred spiral galaxy, JWST NIRCam imaging from programme 1685 ('Uncrowding the Cepheids for an Improved Determination of the Hubble Constant'), two observations (July 2023) combined. The thin black wedge right of the nucleus is sky not covered by either observation."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 1685), retrieved via MAST. Processing: Tritium13 (default colours A, crop set by hand)."
