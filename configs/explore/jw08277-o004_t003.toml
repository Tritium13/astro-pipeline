# Generated by astropipe.explore – default values, refine by hand.
# Target: NGC1527  |  RA 62.10054  Dec -47.89703  |  classification: --

[run]
name = "explore_jw08277_o004_t003_ngc1527"

[data]
program = 8277
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw08277_o004_t003_ngc1527_nircam"
obs = "jw08277-o004_t003_"
bands = ["F115W", "F200W", "F277W"]
max_gb = 3.0

[clean]
method = "none"          # try "local" if stripes are visible

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = "auto"          # brightness centre, falls back to the most interior point
center_band = "F277W"
margin = 100
aspect = 1.0

[caption]
title = "NGC1527 – JWST NIRCam"
description = "JWST NIRCam imaging, programme 8277 ('A Comprehensive Survey of the Stellar Halos of Milky Way Analogs out to 20 Mpc: Revealing Galaxy Merger Histories and Their Effects')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 8277), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
