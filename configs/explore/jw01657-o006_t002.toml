# Generated by astropipe.explore – default values, refine by hand.
# Target: J0217-0208  |  RA 34.34001  Dec -2.14799  |  classification: Galaxy; High-redshift galaxies

[run]
name = "explore_jw01657_o006_t002_j0217_0208"

[data]
program = 1657
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw01657_o006_t002_j0217_0208_nircam"
obs = "jw01657-o006_t002_"
bands = ["F150W", "F200W", "F300M", "F410M"]
max_gb = 3.0

[clean]
# Empty deep field: broad bands + rectangular steps between exposures/detectors.
# "local" (16-px model) and smooth = 51 both keep bands wider than ~16-25 rows -> no visible effect.
method = "sky"           # row profile from empty sky (enough sky in this field)
axis = "auto"            # measured: rows ~2x stronger than columns
smooth = 0               # no high-pass: broad bands are removed too
segment = 512
background2d_cell = 128  # 2-D background (rolling-ball-like): removes detector/exposure steps; OK for compact galaxies

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = "auto"          # brightness centre, falls back to the most interior point
center_band = "F410M"
margin = 100
aspect = 1.0

[caption]
title = "J0217-0208 – JWST NIRCam"
description = "JWST NIRCam imaging, programme 1657 ('Anchoring z>6 Galaxy Metallicities using T_e and n_e Diagnostics Enabled by JWST and ALMA Spectroscopy')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 1657), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
