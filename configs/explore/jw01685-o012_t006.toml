# Generated by astropipe.explore – default values, refine by hand.
# Target: N5643  |  RA 218.16900  Dec -44.17377  |  classification: Galaxy; Spiral galaxies

[run]
name = "explore_jw01685_o012_t006_n5643"

[data]
program = 1685
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw01685_o012_t006_n5643_nircam"
obs = "jw01685-o012_t006_"
bands = ["F090W", "F150W", "F277W"]
max_gb = 3.0

[clean]
method = "auto"          # counter-test 31.10.2026: galaxy fills module -> expect "extended object"

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = "auto"          # brightness centre, falls back to the most interior point
center_band = "F277W"
margin = 100
aspect = 1.0

[caption]
title = "N5643 – JWST NIRCam"
description = "JWST NIRCam imaging, programme 1685 ('Uncrowding the Cepheids for an Improved Determination of the Hubble Constant')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 1685), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
