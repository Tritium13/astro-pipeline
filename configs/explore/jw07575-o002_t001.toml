# Generated by astropipe.explore – default values, refine by hand.
# Target: SN-1987A  |  RA 83.86661  Dec -69.26975  |  classification: Star; Supernovae

[run]
name = "explore_jw07575_o002_t001_sn_1987a"

[data]
program = 7575
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw07575_o002_t001_sn_1987a_nircam"
obs = "jw07575-o002_t001_"
bands = ["F090W", "F115W", "F140M", "F150W", "F200W", "F277W", "F335M", "F356W", "F444W"]
max_gb = 7.0

[clean]
method = "auto"          # measures sky fraction + stripe strength per filter and picks the cleaning (see params/*_run.json)

[grid]
resolution_arcsec = 0.063
orientation = "field"    # rotate the grid so the observed field lies straight (north angle in the caption); "north" = north up

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = [1600, 1643]    # by hand (01.11.2026): top-right detector tile with the bright star, cluster and (probably) SN 1987A; "max" picked an empty tile
size_px = [920, 940]     # [height, width]
center_band = "F444W"
margin = 100

[caption]
title = "SN-1987A – JWST NIRCam"
description = "JWST NIRCam imaging, programme 7575 ('Shocks and destruction of dust in the ring of Supernova 1987A')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 7575), retrieved via MAST. Processing: Tritium13 (explorer run; settings in the configuration)."
