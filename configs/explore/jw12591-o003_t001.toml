# Generated by astropipe.explore – default values, refine by hand.
# Target: Star-Forming-Pillar  |  RA 161.49955  Dec -60.11023  |  classification: ISM; H II regions; Molecular clouds; Pre-main sequence stars; Protostars

[run]
name = "explore_jw12591_o003_t001_star_forming_pillar"

[data]
program = 12591
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw12591_o003_t001_star_forming_pillar_nircam"
obs = "jw12591-o003_t001_"
bands = ["F090W", "F187N", "F212N", "F277W", "F335M", "F470N"]
max_gb = 7.0

[clean]
method = "auto"          # measures sky fraction + stripe strength per filter and picks the cleaning (see params/*_run.json)

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = [2810, 1290]    # by hand (01.11.2026): portrait crop over the whole pillar incl. its head; auto crop cut off the head
size_px = [3400, 1900]   # [height, width]
center_band = "F470N"
margin = 100
aspect = 1.0

[caption]
title = "Star-Forming-Pillar – JWST NIRCam"
description = "JWST NIRCam imaging, programme 12591 ('MIRI and NIRCam imaging of star forming pillar')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 12591), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
