# Generated by astropipe.explore – default values, refine by hand.
# Target: Star-Forming-Pillar  |  RA 161.49955  Dec -60.11023  |  classification: ISM; H II regions; Molecular clouds; Pre-main sequence stars; Protostars

[run]
name = "explore_jw12591_o003_t001_star_forming_pillar"

[data]
program = 12591
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw12591_o003_t001_star_forming_pillar_nircam"
obs = "jw12591-o003_t001_"
bands = ["F090W", "F187N", "F212N", "F277W", "F335M", "F470N"]
max_gb = 7.0

[clean]
method = "auto"          # measures sky fraction + stripe strength per filter and picks the cleaning (see params/*_run.json)

[grid]
resolution_arcsec = 0.063
orientation = "field"    # rotate the grid so the observed field lies straight (north angle in the caption); "north" = north up

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = "max"           # largest rectangle in the observed area (01.11.2026; before: hand crop [2810, 1290], size [3400, 1900] on the north-up grid)
center_band = "F470N"
margin = 100
aspect = 1.0

[caption]
title = "Star-forming pillar in the Carina Nebula – JWST NIRCam"
description = "Star-forming pillar in the South Pillars region of the Carina Nebula (NGC 3372), about 7,500 light-years away (assignment from the coordinates and the pillar pointing towards Eta Carinae, not an official designation). JWST NIRCam imaging, programme 12591 ('MIRI and NIRCam imaging of star forming pillar')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 12591), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
