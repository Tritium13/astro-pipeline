# Generated by astropipe.explore – default values, refine by hand.
# Target: NGC-602  |  RA 22.30492  Dec -73.56131  |  classification: --

[run]
name = "explore_jw07035_o006_t001_ngc_602"

[data]
program = 7035
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw07035_o006_t001_ngc_602_nircam"
obs = "jw07035-o006_t001_"
bands = ["F140M", "F162M", "F182M", "F277W", "F360M", "F444W"]
max_gb = 17.0

[clean]
method = "auto"          # measures sky fraction + stripe strength per filter and picks the cleaning (see params/*_run.json)

[grid]
resolution_arcsec = 0.063

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = [1950, 2000]    # by hand (01.11.2026): landscape crop with the cluster and the surrounding nebula; auto crop cut the cluster at the left edge
size_px = [1800, 2800]   # [height, width]
center_band = "F444W"
margin = 100
aspect = 1.0

[caption]
title = "NGC 602 – young star cluster in the Small Magellanic Cloud – JWST NIRCam"
description = "Young star cluster NGC 602 with its surrounding ring of gas and dust, on the outskirts of the Small Magellanic Cloud (a satellite galaxy of the Milky Way), roughly 200,000 light-years away. Most of the small orange ellipses are background galaxies far behind the cluster. JWST NIRCam imaging, programme 7035 ('Brown Dwarfs in NGC 602 in the SMC - An opportunity to characterize a substellar IMF at low metallicity')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 7035), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
