# Generated by astropipe.explore – default values, refine by hand.
# Target: CWEBTILE-2-15  |  RA 150.37369  Dec 2.27023  |  classification: Galaxy; Field galaxies

[run]
name = "explore_jw01727_o069_t123_cwebtile_2_15"

[data]
program = 1727
instrument = "NIRCAM/IMAGE"
raw_dir = "explore_jw01727_o069_t123_cwebtile_2_15_nircam"
obs = "jw01727-o069_t123_"
bands = ["F115W", "F150W", "F277W", "F444W"]
max_gb = 7.0

[clean]
method = "auto"          # measures sky fraction + stripe strength per filter and picks the cleaning (see params/*_run.json)

[grid]
resolution_arcsec = 0.063
orientation = "field"    # rotate the grid so the observed field lies straight (north angle in the caption); "north" = north up

[background]
box = 150
edge_margin = 150
n_boxes = 6
min_sep = 500
drop_negative = true

[stretch]
black_k = 0.5
white_pct = 99.9
a = 0.05

[color.A_chromatic]
mode = "chromatic"
label = "hues by wavelength, 240° to 0°"

[export]
variants = ["A_chromatic"]
center = "max"           # largest rectangle in the observed area; "content" = chosen by image content; or [y, x] + size_px by hand
center_band = "F444W"
margin = 100

[caption]
title = "CWEBTILE-2-15 – JWST NIRCam"
description = "JWST NIRCam imaging, programme 1727 ('COSMOS-Web: The JWST Cosmic Origins Survey')."
filter_source = ""
credits = "Data: NASA, ESA, CSA, STScI (programme 1727), retrieved via MAST. Processing: Tritium13 (automatic explorer run, default parameters)."
